[package]
name = "macos-toolbox"
version = "0.1.0"
description = "Local macOS developer toolbox"
authors = ["macOS Toolbox Contributors"]
edition = "2021"

[lib]
name = "macos_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
system-info = { path = "../../../crates/system-info" }
